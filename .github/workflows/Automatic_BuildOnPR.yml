name: Build all mods on PR 

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write # Grant write permission for creating releases
  actions: write # Grant write permission to delete old workflow runs

jobs:
  validate-translations:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate changed PO files
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        mapfile -d '' files < <(
          git diff --name-only --diff-filter=ACM -z \
            "$BASE_SHA" "$HEAD_SHA" -- '*.po'
        )

        if (( ${#files[@]} == 0 )); then
          echo "No added or modified PO files to validate."
          exit 0
        fi

        sudo apt-get update
        sudo apt-get install --yes gettext

        for file in "${files[@]}"; do
          echo "Validating $file"
          msgfmt --check --check-format \
            --output-file=/dev/null "$file"
        done

  build:
    needs: validate-translations
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    
    - name: NuGet Restore
      run: msbuild -t:restore -property:Configuration=Release
    
    - name: Build project
      run: msbuild -t:rebuild -property:Configuration=Release -property:GameLibsFolder="../Lib"
    
    # - name: Delete workflow runs
    #   uses: Mattraks/delete-workflow-runs@v2
    #   with:
    #     token: ${{ github.token }}
    #     repository: ${{ github.repository }}
    #     retain_days: 1
    #     keep_minimum_runs: 3
          
